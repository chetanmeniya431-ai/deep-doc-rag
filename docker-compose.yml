services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${APP_PORT:-8012}:8000"
    env_file: .env
    volumes:
      - ./:/app
      - appdata:/app/data
    # Hard caps so a big PDF can never freeze the machine.
    mem_limit: ${APP_MEM_LIMIT:-2g}
    cpus: ${APP_CPUS:-2.5}
    environment:
      OMP_NUM_THREADS: ${MODEL_THREADS:-2}
    restart: unless-stopped

  # Own Ollama for the server. Locally we reuse an Ollama that already runs
  # (see docker-compose.override.yml.example), so this is behind a profile.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    restart: unless-stopped

volumes:
  appdata:
  ollama:
